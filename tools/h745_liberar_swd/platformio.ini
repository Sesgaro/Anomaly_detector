; Programa auxiliar para la NUCLEO-H745ZI-Q: desconecta el SWD de la H745
; (PA13/PA14 en modo analógico) para que el ST-Link de la Nucleo pueda
; programar la pantalla por CN5 sin que la H745 responda en el mismo bus.
; Ver docs/display.md.

[env:nucleo_h745zi_q]
platform = ststm32
board = nucleo_h745zi_q
framework = stm32cube
build_flags = -DCORE_CM7
upload_protocol = stlink
