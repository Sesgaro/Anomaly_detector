; Firmware de la STM32H745 (NUCLEO-H745ZI-Q).
;
; Por ahora solo el núcleo M7 (env cm7): enlace con la pantalla por USART6,
; actualización automática del firmware de la pantalla y datos simulados.
; Según la arquitectura del README, el enlace con la pantalla pasará al M4.
;
; La carga es por el ST-Link de la Nucleo en modo "connect under reset"
; (sirve aunque el programa que corre tenga el SWD deshabilitado).

[platformio]
default_envs = cm7

[env:cm7]
platform = ststm32
board = nucleo_h745zi_q
framework = stm32cube
build_src_filter = +<cm7/>
build_flags =
  -DCORE_CM7
  -Iinclude
  -I../common
  -Wall
extra_scripts = pre:scripts/embed_display.py
platform_packages = platformio/tool-openocd
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -f target/stm32h7x_dual_bank.cfg -c "reset_config srst_only srst_nogate connect_assert_srst" -c "program {$SOURCE} 0x08000000 verify reset exit"
debug_tool = stlink
