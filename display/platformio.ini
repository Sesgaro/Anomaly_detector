; Firmware propio para la pantalla BTT TFT35 B1 V3.0 (STM32F207VCT6).
; La aplicación se enlaza en 0x08008000 para conservar el bootloader de BTT
; (actualización desde microSD). Ver display/README.md.

[platformio]
default_envs = tft35_b1

[env:tft35_b1]
platform = ststm32
board = btt_tft35_b1
framework = stm32cube
board_build.ldscript = ldscript/btt_tft35_b1.ld
lib_deps = lvgl/lvgl@8.3.11
build_flags =
  -DHSE_VALUE=8000000U
  -DAPP_VECTOR_ADDR=0x08008000U
  '-DDISPLAY_FW_VERSION="0.5"'
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -I../common
  -Os
  -Wall
extra_scripts = post:scripts/sd_firmware.py
debug_tool = stlink

; Carga normal: por el UART del enlace (RX2/TX2), sin ST-Link. Requiere que
; la pantalla ya tenga este firmware (con el actualizador) y un puente USB-UART:
;   pio run -t upload --upload-port /dev/ttyUSB0
upload_protocol = custom
upload_command = "$PYTHONEXE" ../pc/display_sim/flash_display.py "$UPLOAD_PORT" "$SOURCE"

; Carga por SWD con un ST-Link (puede ser el de la Nucleo, ver docs/display.md).
; Para la primera carga o para recuperar la pantalla:
;   pio run -e tft35_b1_swd -t upload
; scripts/flash_tft35.tcl verifica que el chip sea el STM32F20x de la pantalla
; antes de escribir y solo toca la flash desde 0x08008000.
[env:tft35_b1_swd]
extends = env:tft35_b1
platform_packages = platformio/tool-openocd
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -f target/stm32f2x.cfg -c "set FW {$SOURCE}" -f scripts/flash_tft35.tcl
